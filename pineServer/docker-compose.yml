version: '3.8'

services:
  pineserver:
    build: .
    container_name: pineserver
    ports:
      - "8000:8000"
    environment:
      - ROBLE_PROJECT_ID=tracking_7d2ad2db74
      - ROBLE_BASE_URL=https://roble-api.openlab.uninorte.edu.co
      - ADMIN_EMAIL=admin@pine.com
      - ADMIN_PASSWORD=ThePassword!1
    restart: unless-stopped
    networks:
      - pine-network

networks:
  pine-network:
    driver: bridge
